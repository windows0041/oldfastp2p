name: fastp2p static artifacts

# Builds the two released static binaries - the musl client and the musl gateway -
# so a deployment never depends on whatever toolchain happens to be on a laptop.
# Both scripts fetch their own musl cross toolchain, which is why the caches below
# matter: without them every run would rebuild OpenSSL, curl, ngtcp2, libwebsockets
# and sqlite from scratch.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: static-artifacts-${{ github.ref }}-${{ inputs.arch || 'x86_64' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: ${{ inputs.arch || 'x86_64' }}
      FASTP2P_MUSL_WORK: ${{ github.workspace }}/work/client
      FASTP2P_STATIC_WORK: ${{ github.workspace }}/work/gateway
      MUSL_CROSS_ROOT: ${{ github.workspace }}/work/musl-cross
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config autoconf automake libtool \
            perl python3 curl wget xz-utils zstd ca-certificates file

      - uses: actions/cache@v4
        with:
          path: work/musl-cross
          key: musl-cross-${{ env.ARCH }}-${{ hashFiles('c/client/scripts/fetch-musl-toolchain.sh', 'c/client/deps.lock.json') }}

      - uses: actions/cache@v4
        with:
          path: |
            work/client
            work/gateway
          key: static-deps-${{ env.ARCH }}-${{ hashFiles('c/client/deps.lock.json', 'c/gateway/scripts/build-static.sh', 'c/client/scripts/build-musl.sh') }}

      - name: Build the static client
        run: bash c/client/scripts/build-musl.sh "$ARCH" --out dist

      - name: Build the static gateway
        run: bash c/gateway/scripts/build-static.sh "$ARCH" --out dist

      - name: Verify the binaries run and report a version
        run: |
          mkdir -p verify
          tar xzf dist/fastp2p-linux-static-*.tar.gz -C verify
          tar xzf dist/fastp2p-gateway-linux-static-*.tar.gz -C verify
          CLIENT=$(find verify -name fastp2p -type f | head -1)
          GATEWAY=$(find verify -name fastp2p-gateway -type f | head -1)
          file "$CLIENT" "$GATEWAY"
          "$CLIENT" --version
          "$GATEWAY" --version

      - uses: actions/upload-artifact@v4
        with:
          name: fastp2p-static-${{ env.ARCH }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/fastp2p-linux-static-*.tar.gz
            dist/fastp2p-gateway-linux-static-*.tar.gz
